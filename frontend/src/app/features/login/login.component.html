<main class="page">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Hi</h1>

    @if (errorMessage()) {
      <div class="alert" role="alert">{{ errorMessage() }}</div>
    }

    <div class="field" [class.invalid]="invalid('email')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      <input type="email" formControlName="email" placeholder="Email*" aria-label="Email" autocomplete="username" />
    </div>
    @if (invalid('email')) {
      <p class="err">{{ emailError() }}</p>
    }

    <div class="field" [class.invalid]="invalid('password')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="12" r="3.5"/><path d="M11 12h10M18 12v3M15 12v2"/></svg>
      <input
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        placeholder="Password*"
        aria-label="Password"
        autocomplete="current-password"
      />
      <button type="button" class="eye" (click)="showPassword.set(!showPassword())"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
          @if (!showPassword()) { <path d="M3 3l18 18"/> }
        </svg>
      </button>
    </div>
    @if (invalid('password')) {
      <p class="err">Password is required</p>
    }

    <button type="submit" class="login-btn" [disabled]="loading()">
      @if (loading()) { <app-spinner /> Signing in... } @else { LOGIN }
    </button>
  </form>
</main>
